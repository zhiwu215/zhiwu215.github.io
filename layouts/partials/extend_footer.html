<script>
  var OSName = "unknown";
  var navApp = navigator.userAgent.toLowerCase();
  switch (true) {
    case (navApp.indexOf("win") != -1):
      OSName = "windows";
      break;
    case (navApp.indexOf("mac") != -1):
      OSName = "apple";
      break;
    case (navApp.indexOf("linux") != -1):
      OSName = "linux";
      break;
    case (navApp.indexOf("x11") != -1):
      OSName = "unix";
      break;
  }

  const images = Array.from(document.querySelectorAll(".post-content img"));
  images.forEach(img => {
    mediumZoom(img, {
      margin: 1, /* 1px 边距 */
      container: null,
      template: null,
    });
  });

  if (OSName == "windows") {
    document.body.className += ' win11'
  }
</script>

<!-- 超长代码块渐变遮罩与一键展开/收起 & 多标签页代码块 (Code Tabs) 交互 -->
<script>
  // 1. 初始化超长代码折叠
  function setupCodeCollapse(container) {
    if (!container || container.querySelector('.code-mask-layer')) return;
    const CODE_MAX_HEIGHT = 320; // 超过 320px 视为超长代码块

    // scrollHeight 为真实内容高度
    if (container.scrollHeight > CODE_MAX_HEIGHT + 20) {
      container.classList.add('code-collapsible');

      const maskLayer = document.createElement('div');
      maskLayer.className = 'code-mask-layer';

      const expandBtn = document.createElement('button');
      expandBtn.type = 'button';
      expandBtn.className = 'code-expand-btn';
      expandBtn.setAttribute('aria-label', '展开全部代码');
      expandBtn.innerHTML = `
        <span class="code-btn-text">展开全部代码</span>
        <svg class="code-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      `;

      const btnText = expandBtn.querySelector('.code-btn-text');
      const btnIcon = expandBtn.querySelector('.code-btn-icon');

      expandBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const willCollapse = container.classList.contains('is-expanded');

        if (willCollapse) {
          container.classList.remove('is-expanded');
          btnText.textContent = '展开全部代码';
          btnIcon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
          expandBtn.setAttribute('aria-label', '展开全部代码');

          // 收起后：如果代码块顶部已滚出视口上方，瞬间回到代码块位置
          const rect = container.getBoundingClientRect();
          if (rect.top < 0) {
            window.scrollTo({
              top: window.scrollY + rect.top - 16,
              behavior: 'instant'
            });
          }
        } else {
          container.classList.add('is-expanded');
          btnText.textContent = '收起代码';
          btnIcon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
          expandBtn.setAttribute('aria-label', '收起代码');
        }
      });

      maskLayer.appendChild(expandBtn);
      container.appendChild(maskLayer);
    }
  }

  // 2. 初始化代码标签页 (Code Tabs)
  function initCodeTabs() {
    document.querySelectorAll('.code-tabs').forEach((tabsWrapper) => {
      const nav = tabsWrapper.querySelector('.code-tabs-nav');
      const panes = Array.from(tabsWrapper.querySelectorAll('.code-tab-pane'));
      if (!nav || panes.length === 0) return;

      // 防止重复初始化
      if (nav.children.length > 0) return;

      panes.forEach((pane, idx) => {
        const title = pane.getAttribute('data-tab-title') || `Tab ${idx + 1}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-tab-btn' + (idx === 0 ? ' is-active' : '');
        btn.setAttribute('role', 'tab');
        btn.textContent = title;

        btn.addEventListener('click', () => {
          if (btn.classList.contains('is-active')) return;

          // 切换按钮状态
          nav.querySelectorAll('.code-tab-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');

          // 切换 Pane 展示
          panes.forEach((p, pIdx) => {
            if (pIdx === idx) {
              p.classList.add('is-active');
              // 切换后检测超长代码折叠
              p.querySelectorAll('.highlight').forEach(setupCodeCollapse);
            } else {
              p.classList.remove('is-active');
            }
          });
        });

        nav.appendChild(btn);
      });

      // 默认激活第 0 个 pane
      panes.forEach((pane, idx) => {
        if (idx === 0) {
          pane.classList.add('is-active');
          pane.querySelectorAll('.highlight').forEach(setupCodeCollapse);
        } else {
          pane.classList.remove('is-active');
        }
      });
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    // 初始化普通代码块的折叠
    document.querySelectorAll('.post-content .highlight').forEach(setupCodeCollapse);
    // 初始化多标签页代码块
    initCodeTabs();
  });

  // 3. Diff 代码块智能复制：自动过滤删除行 (-)，并清洗新增行 (+) 开头符号
  function getCleanDiffCode(codeblock) {
    const lines = codeblock.querySelectorAll('.line');
    if (lines && lines.length > 0) {
      const result = [];
      lines.forEach((line) => {
        // 跳过删除行（含 .gd 标记的行）
        if (line.querySelector('.gd')) return;

        // 取得行文本，去除末尾换行（Hugo 生成的 textContent 每行自带 \n）
        let text = line.textContent.replace(/\n$/, '');
        // 新增行（含 .gi 标记）：去掉开头的 '+' 前缀，保留原始缩进
        if (line.querySelector('.gi')) {
          text = text.replace(/^\+( ?)/, '$1');
        }
        result.push(text);
      });
      return result.join('\n');
    }

    // 兜底正则处理（未生成 .line 标签时）
    return codeblock.textContent
      .split('\n')
      .filter(line => !line.trimStart().startsWith('-'))
      .map(line => line.replace(/^(\s*)\+( ?)/, '$1$2'))
      .join('\n');
  }

  // 4. 查找代码块中实际的代码 <code> 元素（排除行号列）
  function findCodeElement(container) {
    // 表格布局：行号在第一个 td，代码在最后一个 td
    const codeCell = container.querySelector('td.lntd:last-child code');
    if (codeCell) return codeCell;
    // 非表格布局
    return container.querySelector('pre.chroma code') || container.querySelector('pre > code');
  }

  // 5. 捕获阶段拦截 .copy-code 点击，智能提取 Diff 可用代码
  document.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('.copy-code');
    if (!copyBtn) return;

    // 查找对应的代码块容器
    const wrapper = copyBtn.closest('.code-block-wrapper');
    const container = copyBtn.closest('.highlight') || wrapper || copyBtn.parentNode;
    if (!container) return;
    const codeblock = findCodeElement(container);
    if (!codeblock) return;

    // 识别是否为 Diff 代码块
    const isDiff = (wrapper && wrapper.dataset.lang === 'diff') ||
                   codeblock.getAttribute('data-lang') === 'diff' ||
                   codeblock.querySelector('.gd, .gi');

    if (isDiff) {
      // 拦截 PaperMod 自带的复制代码事件
      e.stopImmediatePropagation();
      e.preventDefault();

      const cleanCode = getCleanDiffCode(codeblock);

      function copyingDone() {
        copyBtn.innerHTML = '已复制！';
        setTimeout(() => {
          copyBtn.innerHTML = '复制';
        }, 2000);
      }

      if ('clipboard' in navigator) {
        navigator.clipboard.writeText(cleanCode).then(copyingDone);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = cleanCode;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          copyingDone();
        } catch (err) {}
        document.body.removeChild(textarea);
      }
    }
  }, true);
</script>

<!-- Vercount 站点底部总访问量与访客数统计 -->
<div class="site-footer-stats" id="site-footer-stats" style="text-align: center; padding: 4px 0; color: var(--secondary); font-size: 14px; margin-top: 2px; opacity: 0; transition: opacity 0.4s ease;">
  <span>本站总访问量 <span id="busuanzi_value_site_pv"></span> 次</span>
  <span style="margin: 0 4px;">·</span>
  <span>本站总访客数 <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script>
  // 等待 Vercount 填入数据后淡入显示，避免闪烁
  (function () {
    var stats = document.getElementById('site-footer-stats');
    var pv = document.getElementById('busuanzi_value_site_pv');
    var uv = document.getElementById('busuanzi_value_site_uv');
    if (!stats || !pv || !uv) return;

    function show() { stats.style.opacity = '1'; }

    // 如果数据已经存在（缓存命中等），直接显示
    if (pv.textContent.trim() && uv.textContent.trim()) { show(); return; }

    // 监听 Vercount 脚本写入数据
    var observer = new MutationObserver(function () {
      if (pv.textContent.trim() && uv.textContent.trim()) {
        show();
        observer.disconnect();
      }
    });
    observer.observe(pv, { childList: true, characterData: true, subtree: true });
    observer.observe(uv, { childList: true, characterData: true, subtree: true });

    // 兜底：5 秒后无论如何都显示（防止脚本加载失败导致永久隐藏）
    setTimeout(function () { show(); observer.disconnect(); }, 5000);
  })();
</script>
